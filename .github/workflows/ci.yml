# CI for pull requests (architecture section 9.3, threat S11).
# References NO repository secrets: no secrets context is used, and the job token is read-only.
# Third-party actions are pinned to commit SHAs (S8). Never add `pull_request_target` here.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, types, Vitest, script tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:bot
      - run: npm run test:scripts

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned, hash-checked dependencies
        run: python -m pip install --require-hashes -r apps/fit/requirements-dev.txt
      - name: ruff
        working-directory: apps/fit
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: mypy
        working-directory: apps/fit
        run: python -m mypy
      - name: pytest
        working-directory: apps/fit
        run: python -m pytest -q

  repo-rules:
    name: Repo rules (SQL locality, auth readers, no data files, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-sql-locality.mjs
      - run: node scripts/check-secret-readers.mjs
      - run: node scripts/check-no-data-files.mjs
      - name: Migration lint, including "merged migrations are immutable"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/lint-migrations.mjs --base "origin/${BASE_REF}"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks v8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history
        run: ./gitleaks detect --source . --redact --no-banner --verbose
