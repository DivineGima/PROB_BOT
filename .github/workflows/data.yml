name: data

# Manual runs of the fit job's data commands (architecture sections 6.7 and 9.3). The nightly
# schedule arrives with Stage 7 (nightly.yml). Secrets stay in GitHub; nothing is pasted anywhere.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        required: true
        default: bootstrap-dry-run
        options:
          - bootstrap-dry-run
          - bootstrap
          - ingest
          - d1-probe
          - backtest
          - fit
          - publish
      seasons:
        description: "Seasons for bootstrap, newest first (1 to 10)"
        type: string
        required: false
        default: "3"
      test_days:
        description: "Backtest: length of the test period in days"
        type: string
        required: false
        default: "365"
      models:
        description: "Backtest: comma-separated models (dc, pi, bp); use one sweep point with several"
        type: string
        required: false
        default: "dc"
      half_lives:
        description: "Backtest: comma-separated time-decay half-lives to sweep (days)"
        type: string
        required: false
        default: "200,300,450"
      shrinks:
        description: "Backtest: comma-separated team shrinkage strengths to sweep"
        type: string
        required: false
        default: "2,4,8"

permissions:
  contents: read

concurrency:
  group: footy-data
  cancel-in-progress: false

jobs:
  run:
    name: footy ${{ inputs.command }}
    # Only the reviewed code on main may touch the database (CLAUDE.md: no unreviewed deploys).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned, hash-checked dependencies
        run: python -m pip install --require-hashes -r apps/fit/requirements.txt
      - name: Run
        working-directory: apps/fit
        env:
          # Inputs reach the shell only as environment variables, never inside the script text.
          COMMAND: ${{ inputs.command }}
          SEASONS: ${{ inputs.seasons }}
          TEST_DAYS: ${{ inputs.test_days }}
          MODELS: ${{ inputs.models }}
          HALF_LIVES: ${{ inputs.half_lives }}
          SHRINKS: ${{ inputs.shrinks }}
          PYTHONPATH: src
          # The legal register entry for football-data.org is signed (docs/legal/source_terms_register.md).
          # Least privilege: only the commands that call football-data.org get its token and the
          # legal flag; fit, publish and backtest (numerical code) see the D1 variables only, and
          # the dry run needs no database token.
          SOURCE_ENABLED_FDORG: ${{ contains(fromJSON('["bootstrap-dry-run","bootstrap","ingest"]'), inputs.command) && '1' || '0' }}
          FD_ORG_TOKEN: ${{ contains(fromJSON('["bootstrap-dry-run","bootstrap","ingest"]'), inputs.command) && secrets.FD_ORG_TOKEN || '' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CF_D1_TOKEN: ${{ inputs.command != 'bootstrap-dry-run' && secrets.CF_D1_TOKEN || '' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          case "$COMMAND" in
            bootstrap-dry-run) python -m footy.cli bootstrap --dry-run --seasons "$SEASONS" ;;
            bootstrap)         python -m footy.cli bootstrap --seasons "$SEASONS" ;;
            ingest)            python -m footy.cli ingest ;;
            fit)               python -m footy.cli fit ;;
            publish)           python -m footy.cli publish ;;
            d1-probe)          python -m footy.repo.d1_probe ;;
            backtest)          python -m footy.cli backtest --models "$MODELS" --test-days "$TEST_DAYS" --half-lives "$HALF_LIVES" --shrinks "$SHRINKS" ;;
            *) echo "unknown command" >&2; exit 64 ;;
          esac
