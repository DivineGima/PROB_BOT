name: backup

# Weekly export of the D1 database (architecture sections 9.3 and 9.7, Stage 7): the one copy that
# is not inside Cloudflare. The export is kept as a workflow artifact for 30 days (private repository:
# only people with access to it can download it). Restore drill: docs/runbook.md.
#
# Least privilege: the nightly D1 token only. No Telegram, no football-data.org, no deploy token.
on:
  schedule:
    - cron: "43 2 * * 0" # Sundays 02:43 UTC; not on the hour
  workflow_dispatch:

permissions:
  contents: read

# The export blocks the database while it runs: never beside a nightly or a manual data run.
concurrency:
  group: footy-data
  cancel-in-progress: false

jobs:
  export:
    name: export the database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Export the database
        working-directory: apps/bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 export prob-bot --remote --output "$RUNNER_TEMP/prob-bot.sql"

      - name: Check the export is a real dump
        run: |
          size=$(wc -c < "$RUNNER_TEMP/prob-bot.sql")
          echo "export size: $size bytes"
          test "$size" -gt 10000 || { echo "the export is suspiciously small" >&2; exit 1; }
          grep -q "CREATE TABLE" "$RUNNER_TEMP/prob-bot.sql" || { echo "no tables in the export" >&2; exit 1; }
          grep -q "active_run" "$RUNNER_TEMP/prob-bot.sql" || { echo "active_run is missing from the export" >&2; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prob-bot-d1-export
          path: ${{ runner.temp }}/prob-bot.sql
          retention-days: 30
          if-no-files-found: error
