# Deploy on merge to main (architecture sections 9.3, 9.7). This is the ONLY workflow that references
# CF_DEPLOY_TOKEN (threat S7). GitHub Free private repos have no branch protection or environments, so
# the compensating control below refuses to deploy any commit that is not the merge of a pull request.
#
# First deploy needs Divine's one-time setup first: see docs/setup.md.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Guard - this commit must be the merge of a pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-merged-pr.mjs

      - name: Guard - wrangler.toml must hold the real D1 database id
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' apps/bot/wrangler.toml; then
            echo "wrangler.toml still has the placeholder database_id; see docs/setup.md" >&2
            exit 1
          fi

      - run: npm ci

      - name: Apply D1 migrations (forward-only)
        working-directory: apps/bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply prob-bot --remote

      - name: Deploy the Worker
        working-directory: apps/bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Register the Telegram webhook
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WEBHOOK_PATH_SECRET: ${{ secrets.WEBHOOK_PATH_SECRET }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/set-webhook.mjs

      - name: Post-deploy smoke
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WEBHOOK_PATH_SECRET: ${{ secrets.WEBHOOK_PATH_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/smoke.mjs
