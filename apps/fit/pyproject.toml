[project]
name = "footy"
version = "0.0.0"
description = "Nightly fit job for the Football Reliability Screener and Probability Bot"
requires-python = ">=3.12"
dependencies = ["requests>=2.34,<3"]

[project.scripts]
footy = "footy.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# asserts, fixed fake tokens and seeded PRNGs for test data are expected in tests
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

# scipy ships no type stubs; it is used only through scipy.optimize.minimize.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
